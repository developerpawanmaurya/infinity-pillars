<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    @keyframes ip-outline-loop {
      0% { stroke-dashoffset: 100; opacity: 1; }
      40% { stroke-dashoffset: 0; opacity: 1; }
      48% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes ip-fill-loop {
      0%, 45% { opacity: 0; }
      58% { opacity: 1; }
      92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes ip-outline-once {
      0% { stroke-dashoffset: 100; opacity: 1; }
      60% { stroke-dashoffset: 0; opacity: 1; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes ip-fill-once {
      0%, 60% { opacity: 0; }
      85%, 100% { opacity: 1; }
    }
    @keyframes ip-wipe-loop {
      0% { clip-path: inset(0 100% 0 0); }
      45% { clip-path: inset(0 0% 0 0); }
      75% { clip-path: inset(0 0% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
    @keyframes ip-wipe-once {
      0% { clip-path: inset(0 100% 0 0); }
      70% { clip-path: inset(0 0% 0 0); }
      100% { clip-path: inset(0 0% 0 0); }
    }
    @keyframes ip-spin { to { transform: rotate(360deg); } }
    @keyframes ip-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.07); opacity: .8; }
    }
    @keyframes ip-bounce {
      0% { transform: scale(.3); opacity: 0; }
      55% { transform: scale(1.12); opacity: 1; }
      75% { transform: scale(.94); }
      100% { transform: scale(1); }
    }
    @keyframes ip-fade {
      0%, 100% { opacity: 1; }
      50% { opacity: .1; }
    }
    @keyframes ip-sheen-move {
      0% { transform: translateX(-420px); }
      100% { transform: translateX(420px); }
    }
    @keyframes ip-orbit-spin { to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="width:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:{{ stageMinHeight }}">
  <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}">

              <path d="{{ path2 }}" fill="#fff"/>

            <linearGradient id="ipGradDark" x1="0" y1="0" x2="1" y2="0">

              <stop offset="50%" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="ipOrbitGradDark" cx="0.5" cy="0.5" r="0.6">
              <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <sc-if value="{{ useDraw }}" hint-placeholder-val="{{ false }}">
            <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="{{ outlineStyle }}">
              <path pathLength="100" d="{{ drawPath1 }}"/>
              <path pathLength="100" d="{{ drawPath2 }}"/>
            </g>
          </sc-if>
          <g fill="currentColor" style="{{ fillStyle }}">
            <path d="{{ path1 }}"/>
            <path d="{{ path2 }}"/>
          </g>
          <sc-if value="{{ showSheen }}" hint-placeholder-val="{{ false }}">
            <rect x="102" y="319" width="795.6" height="362" fill="url(#ipGradDark)" mask="url(#ipMaskDark)" style="{{ sheenStyle }}"/>
          </sc-if>
          <sc-if value="{{ showOrbit }}" hint-placeholder-val="{{ false }}">
            <rect x="300" y="240" width="440" height="440" fill="url(#ipOrbitGradDark)" mask="url(#ipMaskDark)" style="{{ orbitStyle }}"/>
          </sc-if>
        </svg>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;min-height:{{ stageMinHeight }};display:flex;align-items:center;justify-content:center;background:#f7f6f2">
      <div style="{{ wrapStyle }}">
        <svg viewBox="102 319 795.6 362" style="width:100%;height:auto;display:block;overflow:visible;transform-box:view-box;transform-origin:50% 50%;color:#353535;animation:{{ svgAnim }}">
          <defs>
            <mask id="ipMaskLight" maskUnits="userSpaceOnUse" x="102" y="319" width="795.6" height="362">
              <path d="{{ path1 }}" fill="#fff"/>
              <path d="{{ path2 }}" fill="#fff"/>
            </mask>
            <linearGradient id="ipGradLight" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
              <stop offset="50%" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="ipOrbitGradLight" cx="0.5" cy="0.5" r="0.6">
              <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <sc-if value="{{ useDraw }}" hint-placeholder-val="{{ false }}">
            <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="{{ outlineStyle }}">
              <path pathLength="100" d="{{ drawPath1 }}"/>
              <path pathLength="100" d="{{ drawPath2 }}"/>
            </g>
          </sc-if>
          <g fill="currentColor" style="{{ fillStyle }}">
            <path d="{{ path1 }}"/>
            <path d="{{ path2 }}"/>
          </g>
          <sc-if value="{{ showSheen }}" hint-placeholder-val="{{ false }}">
            <rect x="102" y="319" width="795.6" height="362" fill="url(#ipGradLight)" mask="url(#ipMaskLight)" style="{{ sheenStyle }}"/>
          </sc-if>
          <sc-if value="{{ showOrbit }}" hint-placeholder-val="{{ false }}">
            <rect x="300" y="240" width="440" height="440" fill="url(#ipOrbitGradLight)" mask="url(#ipMaskLight)" style="{{ orbitStyle }}"/>
          </sc-if>
        </svg>
      </div>
    </div>
  </sc-if>
</div>
