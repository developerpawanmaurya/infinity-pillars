name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  # ── React SPA → /domains/infinitypillars.com/public_html/ ──────────────────
  deploy-web:
    runs-on: ubuntu-latest
    env:
      WEB_DIR: /domains/infinitypillars.com/public_html
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: https://infinity-pillars.onrender.com/api
        run: npx vite build --outDir ../../dist/apps/web

      # SamKirkland/FTP-Deploy-Action (basic-ftp under the hood) can't open a
      # control-socket connection to this host at all — confirmed via the
      # Actions logs ("Error: Timeout (control socket)"), even as the only
      # job running with no other FTP traffic. Plain curl against the same
      # host/credentials works fine (see deploy-wp-theme below, which never
      # used the action), so every deploy job now uploads via curl instead.
      - name: Deploy build via curl
        working-directory: dist/apps/web
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          find . -type f | sed 's|^\./||' | xargs -P 8 -I {} \
            curl --ssl-reqd --insecure --ftp-create-dirs --silent --show-error \
              -T "{}" "ftp://${FTP_HOST}${WEB_DIR}/{}" -u "${FTP_USER}:${FTP_PASS}"

  # ── Gutenberg blocks plugin → …/blog/wp-content/plugins/ip-blocks/ ─────────
  deploy-wp-plugin:
    needs: deploy-web
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: /domains/infinitypillars.com/public_html/blog/wp-content/plugins/ip-blocks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy plugin via curl
        working-directory: apps/wp-plugin-ip-blocks
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          find . -type f \
            -not -path './node_modules/*' \
            -not -path './src/*' \
            -not -path './.git*' \
            -not -name 'package.json' \
            -not -name 'package-lock.json' \
            -not -name 'webpack.config.js' \
            -not -name '.gitignore' \
            | sed 's|^\./||' | xargs -P 8 -I {} \
            curl --ssl-reqd --insecure --ftp-create-dirs --silent --show-error \
              -T "{}" "ftp://${FTP_HOST}${PLUGIN_DIR}/{}" -u "${FTP_USER}:${FTP_PASS}"

  # ── Custom theme → …/blog/wp-content/themes/ip-theme/ ─────────────────────
  deploy-wp-theme:
    needs: deploy-wp-plugin
    runs-on: ubuntu-latest
    env:
      THEME_DIR: /domains/infinitypillars.com/public_html/blog/wp-content/themes/ip-theme
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy theme files via curl
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for file in apps/wp-theme-ip/functions.php apps/wp-theme-ip/index.php apps/wp-theme-ip/style.css; do
            filename=$(basename "$file")
            curl --ssl-reqd --insecure --ftp-create-dirs --silent --show-error \
              -T "$file" \
              "ftp://${FTP_HOST}${THEME_DIR}/${filename}" \
              -u "${FTP_USER}:${FTP_PASS}"
          done
