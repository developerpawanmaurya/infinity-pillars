name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  # ── React SPA → /domains/infinitypillars.com/public_html/ ──────────────────
  deploy-web:
    runs-on: ubuntu-latest
    env:
      WEB_DIR: /domains/infinitypillars.com/public_html
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: https://infinity-pillars.onrender.com/api
        run: npx vite build --outDir ../../dist/apps/web

      # Three fixes in, in order of what broke:
      # 1. SamKirkland/FTP-Deploy-Action (basic-ftp) couldn't open a
      #    control-socket connection to this host at all.
      # 2. Switched to per-file curl, which hit unescaped spaces/parens in
      #    real paths, then a --ftp-create-dirs race under `xargs -P 8`.
      # 3. Fixed both of those, but 260+ files means 260+ separate
      #    connect/login/quit cycles — the host started refusing new
      #    connections partway through ("Couldn't connect to server"),
      #    almost certainly a connection-rate limit on the FTP account.
      # lftp's mirror keeps ONE control connection open for the entire
      # transfer instead of reconnecting per file, which sidesteps all of
      # that at once.
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy build via lftp
        working-directory: dist/apps/web
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate false;
            set net:max-retries 3;
            set net:timeout 20;
            mirror --reverse --verbose --continue ./ ${WEB_DIR};
            bye
          " "$FTP_HOST"

  # ── Gutenberg blocks plugin → …/blog/wp-content/plugins/ip-blocks/ ─────────
  deploy-wp-plugin:
    needs: deploy-web
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: /domains/infinitypillars.com/public_html/blog/wp-content/plugins/ip-blocks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy plugin via lftp
        working-directory: apps/wp-plugin-ip-blocks
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate false;
            set net:max-retries 3;
            set net:timeout 20;
            mirror --reverse --verbose --continue \
              --exclude-glob node_modules/ \
              --exclude-glob src/ \
              --exclude-glob '.git*' \
              --exclude-glob 'package.json' \
              --exclude-glob 'package-lock.json' \
              --exclude-glob 'webpack.config.js' \
              --exclude-glob '.gitignore' \
              ./ ${PLUGIN_DIR};
            bye
          " "$FTP_HOST"

  # ── Custom theme → …/blog/wp-content/themes/ip-theme/ ─────────────────────
  deploy-wp-theme:
    needs: deploy-wp-plugin
    runs-on: ubuntu-latest
    env:
      THEME_DIR: /domains/infinitypillars.com/public_html/blog/wp-content/themes/ip-theme
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy theme files via curl
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for file in apps/wp-theme-ip/functions.php apps/wp-theme-ip/index.php apps/wp-theme-ip/style.css; do
            filename=$(basename "$file")
            curl --ssl-reqd --insecure --ftp-create-dirs --silent --show-error \
              -T "$file" \
              "ftp://${FTP_HOST}${THEME_DIR}/${filename}" \
              -u "${FTP_USER}:${FTP_PASS}"
          done
